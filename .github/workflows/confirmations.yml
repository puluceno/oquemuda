name: confirmations
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency: { group: confirmations, cancel-in-progress: false }

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node alert.js confirm
        env:
          ALERTS_URL: ${{ secrets.ALERTS_URL }}
          ALERTS_KEY: ${{ secrets.ALERTS_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
